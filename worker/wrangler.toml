name = "jarvis-car-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Origine della web app (GitHub Pages). Più origini separate da virgola.
# Per provare in locale aggiungi "http://localhost:8080".
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USER.github.io"
TOKEN_TTL_DAYS = "30"
# GROQ_MODEL = "openai/gpt-oss-20b"

# Facoltativo: blocco dopo 5 login errati in 15 minuti (per IP).
# Crea il namespace con: npx wrangler kv namespace create JC_KV
# [[kv_namespaces]]
# binding = "JC_KV"
# id = "INCOLLA_QUI_L_ID"

# I secret NON vanno qui. Impostali con:
#   npx wrangler secret put JC_USERNAME
#   npx wrangler secret put JC_PASSWORD
#   npx wrangler secret put TOKEN_SECRET      (stringa casuale lunga)
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put TOMTOM_API_KEY
#   npx wrangler secret put YOUTUBE_API_KEY   (facoltativa, per la musica)
